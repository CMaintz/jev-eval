name: publish
# Publishes jev-eval to PyPI when a vX.Y.Z tag is pushed. Auth is PyPI trusted publishing
# (OIDC): no token, but pypi.org must list this repo, this workflow file and the `pypi`
# environment as a trusted (or pending) publisher. The tag must match pyproject's version.
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Tag matches pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$ver" ]; then
            echo "::error::$TAG does not match pyproject.toml ($ver)"
            exit 1
          fi
      - run: python -m pip install --disable-pip-version-check build==1.6.1
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jev-eval/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
