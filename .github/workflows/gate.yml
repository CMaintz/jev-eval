# Foundry pinned to a full main SHA: the Python stack is on main but not in a release
# tag yet. Move this pin to the next v2 tag once it ships.
name: gate
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: CMaintz/foundry/.github/workflows/gate.yml@ed570f522673f85891c77036d3a8941531c5755d   # the public facade - pin this, not the per-stack files
    with:
      stack: "python"
      working_directory: "."
