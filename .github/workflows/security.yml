# Foundry pinned to a full main SHA: the Python stack is on main but not in a release
# tag yet. Move this pin to the next v2 tag once it ships.
name: security
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: CMaintz/foundry/.github/workflows/security.yml@ed570f522673f85891c77036d3a8941531c5755d   # facade: secret scan + ruleset-guard + SAST
    permissions: { contents: read, pull-requests: read }   # the secret scan lists the PR's commits
